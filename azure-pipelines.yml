trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'freakyfashion-api'
  registry: 'mcratzacr.azurecr.io'
  tag: '$(Build.BuildId)'

steps:

- checkout: self

# BUILD (kopplad till registry!)
- task: Docker@2
  displayName: Build image
  inputs:
    command: build
    repository: $(registry)/$(imageName)
    dockerfile: Dockerfile
    tags: |
      $(tag)

# PUSH (exakt samma image)
- task: Docker@2
  displayName: Push image to ACR
  inputs:
    command: push
    repository: $(registry)/$(imageName)
    containerRegistry: 'mcratzacr'
    tags: |
      $(tag)