trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'freakyfashion-api'
  tag: '$(Build.BuildId)'

steps:

- checkout: self

- task: Docker@2
  displayName: Build and push to ACR
  inputs:
    command: buildAndPush
    containerRegistry: 'mcratzacr'
    repository: $(imageName)
    dockerfile: Dockerfile
    tags: |
      $(tag)